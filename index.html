<!doctype html>
<html lang="ru" class="intro-on">

  <!-- Светлая тема, если её включили в меню; ставим до отрисовки, чтобы не мигало. -->
  <script>try { if (JSON.parse(localStorage.getItem('sg_theme')) === 'light') { document.documentElement.classList.add('light'); document.querySelector('meta[name="theme-color"]').content = '#ffffff'; } } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Шрифты не блокируют показ: пока грузятся, текст виден системным шрифтом. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css?v=26">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <aside class="drawer" id="drawer" aria-label="Меню"></aside>

  <div class="toast" id="toast"></div>

  <script src="data.js?v=26"></script>
